<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TES Charger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#ddd;padding:12px;max-width:500px;margin:0 auto}
h1{font-size:1.1em;color:#5af;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.ts{font-size:.7em;color:#444}
.card{background:#181818;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #222}
.badge{text-align:center;padding:10px;border-radius:7px;font-weight:bold;font-size:1.15em;margin-bottom:12px;letter-spacing:2px}
.s-idle{background:#1e1e1e;color:#666}
.s-connecting,.s-pre_charge{background:#071a2e;color:#4af}
.s-charging{background:#071f07;color:#4d4}
.s-ending,.s-finalizing{background:#201800;color:#db4}
.s-fault,.s-emergency{background:#200707;color:#f55}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #222}
.row:last-child{border-bottom:none}
.lbl{color:#666;font-size:.88em}
.val{font-weight:bold}
.big{font-size:1.4em}
.prog-wrap{margin:8px 0 4px}
.prog-label{display:flex;justify-content:space-between;font-size:.8em;color:#666;margin-bottom:4px}
progress{width:100%;height:16px;border-radius:8px;appearance:none;-webkit-appearance:none;background:#222;display:block}
progress::-webkit-progress-bar{background:#222;border-radius:8px}
progress::-webkit-progress-value{background:linear-gradient(90deg,#1a3a6a,#48f);border-radius:8px;transition:width .4s}
.btns{display:flex;gap:8px}
button{flex:1;padding:13px;border:none;border-radius:8px;font-size:1em;cursor:pointer;font-weight:bold;transition:opacity .15s}
button:active{opacity:.65}
.b-start{background:#1d5e2a;color:#fff}
.b-stop{background:#5e1d1d;color:#fff}
.b-save{background:#1d3a5e;color:#fff;margin-top:10px;width:100%;flex:none}
.b-ota{background:#1d3a5e;color:#fff;padding:11px;border:none;border-radius:8px;font-size:.95em;cursor:pointer;font-weight:bold;width:100%;margin-top:10px;transition:opacity .15s}
.b-ota:active{opacity:.65}
.b-ota:disabled{opacity:.4;cursor:default}
.ota-prog-wrap{margin:10px 0 4px;display:none}
.ota-prog-bar{width:100%;height:12px;border-radius:6px;appearance:none;-webkit-appearance:none;background:#222;display:block}
.ota-prog-bar::-webkit-progress-bar{background:#222;border-radius:6px}
.ota-prog-bar::-webkit-progress-value{background:linear-gradient(90deg,#1a3a6a,#48f);border-radius:6px;transition:width .4s}
.ver{color:#444;font-size:.75em;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:5px}
input[type=text],input[type=number],input[type=password]{
  width:100%;padding:9px 10px;margin-top:5px;
  background:#222;border:1px solid #3a3a3a;color:#ddd;border-radius:6px;font-size:.95em}
input:focus{outline:none;border-color:#48f}
label.lbl2{display:block;color:#666;font-size:.82em;margin-top:10px}
.chk-row{display:flex;align-items:center;gap:8px;margin-top:12px;color:#aaa;font-size:.9em}
input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:#48f}
#msg{font-size:.85em;margin-top:8px;min-height:1.1em}
.ok{color:#4d4}.err{color:#f55}
section-title{font-weight:bold;font-size:.95em;color:#aaa;display:block;margin-bottom:8px}
</style>
</head>
<body>

<h1>⚡ TES Charger <span class="ts" id="ts">--:--:--</span></h1>

<!-- 狀態卡 -->
<div class="card">
  <div class="badge s-idle" id="badge">STANDBY</div>
  <div class="row">
    <span class="lbl">輸出電壓</span>
    <span class="val big" id="v">-- V</span>
  </div>
  <div class="row">
    <span class="lbl">輸出電流</span>
    <span class="val big" id="a">-- A</span>
  </div>
  <div class="prog-wrap">
    <div class="prog-label">
      <span>SOC</span><span id="soc-txt">-- / --%</span>
    </div>
    <progress id="pb" value="0" max="100"></progress>
  </div>
  <div class="row" id="tr" style="display:none">
    <span class="lbl">剩餘時間</span>
    <span class="val" id="rem">--</span>
  </div>
  <div class="row" id="fr" style="display:none">
    <span class="lbl" style="color:#f55">故障碼</span>
    <span class="val" style="color:#f55" id="fc">--</span>
  </div>
</div>

<!-- 控制按鈕 -->
<div class="card btns">
  <button class="b-start" onclick="act('/start')">▶&nbsp;開始充電</button>
  <button class="b-stop"  onclick="act('/stop')">◼&nbsp;停止充電</button>
</div>

<!-- 網路狀態 -->
<div class="card">
  <div class="row">
    <span class="lbl">WiFi 狀態</span>
    <span id="ws"><span class="dot" style="background:#555"></span>未連線</span>
  </div>
  <div class="row">
    <span class="lbl">IP 位址</span>
    <span id="ip" style="font-family:monospace">--</span>
  </div>
  <div class="row">
    <span class="lbl">主機名稱</span>
    <span style="font-family:monospace;color:#555">tes-charger.local</span>
  </div>
</div>

<!-- OTA 韌體更新 -->
<div class="card">
  <section-title>🔄 韌體更新</section-title>
  <div id="ota-msg"></div>
  <div class="ota-prog-wrap" id="ota-pw">
    <div class="prog-label">
      <span>下載進度</span><span id="ota-pct">0%</span>
    </div>
    <progress class="ota-prog-bar" id="ota-pb" value="0" max="100"></progress>
  </div>
  <button class="b-ota" id="ota-btn" onclick="startOta()">⬆ 更新至最新韌體</button>
  <div class="ver" id="fw-ver"></div>
</div>

<!-- 設定 -->
<div class="card">
  <section-title>⚙ 設定</section-title>
  <div class="chk-row">
    <input type="checkbox" id="cav" onchange="updateAutoVoltUI()">
    <span>自動設定電壓上限（依開機 ADC 量測）</span>
  </div>
  <label class="lbl2" id="cv-lbl">最大電壓 (V)</label>
  <input type="number" id="cv" step="0.1" min="40" max="120">
  <label class="lbl2">最大電流 (A)</label>
  <input type="number" id="ca" step="0.1" min="1" max="100">
  <label class="lbl2">目標 SOC (%)</label>
  <input type="number" id="cs" step="1" min="20" max="100">
  <label class="lbl2">WiFi SSID</label>
  <input type="text" id="ci" autocomplete="off" placeholder="路由器名稱">
  <label class="lbl2">WiFi 密碼（留空保持不變）</label>
  <input type="password" id="cp" placeholder="••••••••">
  <div class="chk-row">
    <input type="checkbox" id="cb">
    <span>LuxBeacon SOC 燈號</span>
  </div>
  <button class="b-save" onclick="save()">💾&nbsp;儲存設定</button>
  <div id="msg"></div>
</div>

<script>
const SL={
  idle:'STANDBY',connecting:'CONNECTING',pre_charge:'PRE-CHARGE',
  charging:'CHARGING',ending:'ENDING',finalizing:'FINALIZING',
  fault:'FAULT',emergency:'EMERGENCY'
};
const SC={
  idle:'badge s-idle',connecting:'badge s-connecting',
  pre_charge:'badge s-pre_charge',charging:'badge s-charging',
  ending:'badge s-ending',finalizing:'badge s-finalizing',
  fault:'badge s-fault',emergency:'badge s-emergency'
};

function fmt(s){
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?`${h}h ${String(m).padStart(2,'0')}m`
          :`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

async function poll(){
  try{
    const d=await(await fetch('/status')).json();
    const b=document.getElementById('badge');
    if(d.state==='idle'&&d.fault){
      b.textContent='FAULT STOP';
      b.className='badge s-fault';
    } else {
      b.textContent=SL[d.state]||d.state.toUpperCase();
      b.className=SC[d.state]||'badge s-idle';
    }

    document.getElementById('v').textContent=d.voltage.toFixed(1)+' V';
    document.getElementById('a').textContent=d.current.toFixed(1)+' A';
    document.getElementById('soc-txt').textContent=d.soc+' / '+d.target_soc+'%';
    document.getElementById('pb').value=d.soc;
    document.getElementById('pb').max=d.target_soc||100;

    const tr=document.getElementById('tr');
    if(d.timer_running&&d.remaining_seconds>0){
      tr.style.display='flex';
      document.getElementById('rem').textContent=fmt(d.remaining_seconds);
    }else tr.style.display='none';

    const fr=document.getElementById('fr');
    if(d.fault&&d.fault_flags){
      fr.style.display='flex';
      document.getElementById('fc').textContent='0x'+d.fault_flags.toString(16).toUpperCase().padStart(2,'0');
    }else fr.style.display='none';

    const dot=d.wifi_connected?'#4d4':'#f55';
    const txt=d.wifi_connected?'已連線':'未連線';
    document.getElementById('ws').innerHTML=`<span class="dot" style="background:${dot}"></span>${txt}`;
    document.getElementById('ip').textContent=d.ip||'--';
    document.getElementById('ts').textContent=new Date().toLocaleTimeString();

    // 韌體版本
    if(d.firmware_version)
      document.getElementById('fw-ver').textContent='目前版本：'+d.firmware_version;

    // OTA 狀態
    const btn=document.getElementById('ota-btn');
    const pw=document.getElementById('ota-pw');
    const om=document.getElementById('ota-msg');
    if(d.ota_running){
      pw.style.display='block';
      document.getElementById('ota-pb').value=d.ota_progress;
      document.getElementById('ota-pct').textContent=d.ota_progress+'%';
      om.className='';
      om.textContent='更新中，請勿斷電…';
      btn.disabled=true;
    } else if(d.ota_error){
      pw.style.display='none';
      om.className='err';
      om.textContent='✗ '+d.ota_error;
      btn.disabled=false;
    } else {
      if(document.getElementById('ota-pb').value==100){
        om.className='ok';
        om.textContent='✓ 更新完成，重新啟動中…';
        btn.disabled=true;
      } else {
        pw.style.display='none';
        btn.disabled=false;
      }
    }
  }catch(e){}
}

function updateAutoVoltUI(){
  const on=document.getElementById('cav').checked;
  document.getElementById('cv-lbl').textContent=on?'電壓安全上限 (V)':'最大電壓 (V)';
}

async function loadCfg(){
  try{
    const d=await(await fetch('/config')).json();
    document.getElementById('cav').checked=d.auto_voltage;
    document.getElementById('cv').value=d.max_voltage;
    document.getElementById('ca').value=d.max_current;
    document.getElementById('cs').value=d.target_soc;
    document.getElementById('ci').value=d.wifi_ssid;
    document.getElementById('cb').checked=d.beacon;
    updateAutoVoltUI();
  }catch(e){}
}

async function save(){
  const b={
    auto_voltage:document.getElementById('cav').checked,
    max_voltage:parseFloat(document.getElementById('cv').value),
    max_current:parseFloat(document.getElementById('ca').value),
    target_soc:parseInt(document.getElementById('cs').value),
    wifi_ssid:document.getElementById('ci').value,
    beacon:document.getElementById('cb').checked
  };
  const p=document.getElementById('cp').value;
  if(p)b.wifi_pass=p;
  const m=document.getElementById('msg');
  try{
    const r=await(await fetch('/config',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(b)
    })).json();
    m.className=r.ok?'ok':'err';
    m.textContent=r.ok?'✓ 已儲存（WiFi 變更需重啟生效）':'✗ 儲存失敗';
    if(r.ok)setTimeout(()=>m.textContent='',5000);
  }catch(e){m.className='err';m.textContent='✗ 連線錯誤';}
}

async function act(url){
  try{await fetch(url,{method:'POST'});}catch(e){}
}

async function startOta(){
  const btn=document.getElementById('ota-btn');
  const om=document.getElementById('ota-msg');
  if(!confirm('確定要更新韌體嗎？更新期間請勿斷電。'))return;
  btn.disabled=true;
  om.className='';
  om.textContent='連線中…';
  try{
    const r=await(await fetch('/ota',{method:'POST'})).json();
    if(!r.ok){om.className='err';om.textContent='✗ 無法啟動更新';btn.disabled=false;}
  }catch(e){om.className='err';om.textContent='✗ 連線錯誤';btn.disabled=false;}
}

loadCfg();
poll();
setInterval(poll,1000);
</script>
</body>
</html>
