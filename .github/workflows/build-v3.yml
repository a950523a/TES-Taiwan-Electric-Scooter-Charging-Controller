name: Build and Release V3

on:
  push:
    branches: [V3-dev, main]
    tags: ['v3.*']
  pull_request:
    branches: [main, V3-dev]
  workflow_dispatch:

permissions:
  contents: write   # 建立 Release 需要寫入權限

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 目前支援的硬體變體 ──────────────────────────────────────────
          - variant: esp32s3-ssd1306
            target: esp32s3
            idf_version: v5.5.1

          # 新增硬體時在此加一行，例如：
          # - variant: esp32s3-lvgl-ili9341
          #   target: esp32s3
          #   idf_version: v5.5.1

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware + generate merged binary
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: ${{ matrix.target }}
          command: idf.py build && idf.py merge-bin -o build/tes_charger_flash.bin
          path: firmware

      # variant 目前只有一種，直接用通用檔名；
      # 未來多 variant 時改為 tes_charger_${{ matrix.variant }}.bin
      - name: Stage release assets
        run: |
          mkdir -p release
          cp firmware/build/tes_charger.bin       release/tes_charger.bin
          cp firmware/build/tes_charger_flash.bin release/tes_charger_flash.bin

      - name: Upload build artifacts (每次 push 都保留)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          retention-days: 30
          path: release/

      - name: Publish to GitHub Release (僅 tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TES Charger ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/tes_charger.bin
            release/tes_charger_flash.bin
