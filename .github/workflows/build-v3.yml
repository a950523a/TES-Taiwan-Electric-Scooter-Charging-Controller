name: Build and Release V3

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# 預設唯讀，寫入權限下放到真正需要的 job。
# workflow 層給 contents:write 會讓 pull_request 觸發的執行也帶著寫入 token。
permissions:
  contents: read

# 連續推送時，同一分支只保留最新一次建置。
# Pages 部署尤其不能並行 —— 兩次部署競爭會讓上線內容變成先後不定。
# tag 建置不取消：那是要產出 Release 的，中途取消會留下沒有附件的空 Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建立 Release 需要
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 目前支援的硬體變體 ──────────────────────────────────────────
          - variant: esp32s3-ssd1306
            target: esp32s3
            idf_version: v5.5.1

          # 新增硬體時在此加一行，例如：
          # - variant: esp32s3-lvgl-ili9341
          #   target: esp32s3
          #   idf_version: v5.5.1

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # firmware/CMakeLists.txt 用 `git describe --always --tags --dirty`
          # 產生 PROJECT_VER。預設的淺複製不含 tag 與歷史，describe 會落回
          # --always 只給短 hash，韌體回報的版本就失去意義。
          fetch-depth: 0

      - name: Build firmware + generate merged binary
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: ${{ matrix.target }}
          # safe.directory：建置在容器內進行，工作目錄的擁有者與容器使用者不同時
          # git 會拒絕操作，describe 靜默失敗（CMake 端是 ERROR_QUIET），
          # 版本字串就變成 "dev"。加這行是廉價的保險。
          command: >-
            git config --global --add safe.directory '*' &&
            idf.py build &&
            idf.py merge-bin -o tes_charger_flash.bin
          path: firmware

      # 把實際編進韌體的版本字串印出來。沒有這行，版本錯了也只有燒進機器
      # 才會發現 —— 本機就發生過 PROJECT_VER 停在舊值的情況。
      - name: Report firmware version
        run: |
          DESCRIBE="$(git describe --always --tags --dirty 2>&1 || true)"
          BUILT="$(python3 -c "import json;print(json.load(open('firmware/build/project_description.json'))['project_version'])")"
          echo "git describe      : $DESCRIBE"
          echo "compiled into app : $BUILT"
          # PROJECT_VER 由 CMake 在 configure 階段算一次。真的編進去的值才算數 ——
          # 若這裡出現 "dev" 或純 hash，代表 git describe 在容器內失敗了。
          case "$BUILT" in
            dev|"") echo "::error::PROJECT_VER 是 '$BUILT' —— git describe 在建置環境失敗"; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$BUILT" != "${GITHUB_REF_NAME}" ]; then
            echo "::warning::tag 是 ${GITHUB_REF_NAME} 但韌體回報 $BUILT"
          fi

      # variant 目前只有一種，直接用通用檔名；
      # 未來多 variant 時改為 tes_charger_${{ matrix.variant }}.bin
      - name: Stage release assets
        run: |
          mkdir -p release
          cp firmware/build/tes_charger.bin       release/tes_charger.bin
          cp firmware/build/tes_charger_flash.bin release/tes_charger_flash.bin

      - name: Upload build artifacts (每次 push 都保留)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          retention-days: 30
          path: release/

      - name: Publish to GitHub Release (僅 tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TES Charger ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/tes_charger.bin
            release/tes_charger_flash.bin

      # 只有主要 variant 負責部署 Pages（多 variant 時只能 upload 一次）
      - name: Prepare GitHub Pages content
        if: |
          matrix.variant == 'esp32s3-ssd1306' &&
          (github.ref == 'refs/heads/main' ||
           (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')))
        run: |
          mkdir -p _pages
          cp -r docs/. _pages/
          cp firmware/build/tes_charger_flash.bin _pages/tes_charger_flash.bin

      - name: Upload Pages artifact
        if: |
          matrix.variant == 'esp32s3-ssd1306' &&
          (github.ref == 'refs/heads/main' ||
           (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')))
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages/

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build
    if: |
      github.ref == 'refs/heads/main' ||
      (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    permissions:
      pages: write      # 部署 GitHub Pages
      id-token: write   # Pages OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
